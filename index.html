<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSTECH — Tài liệu sản phẩm</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel2: #2d2d30;
    --border: #3e3e42; --accent: #007acc;
    --text: #eeeeee; --muted: #b0b0b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px;
  }
  header {
    background: var(--panel2); border-bottom: 1px solid var(--border);
    padding: 28px 40px;
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; }
  header p { margin: 6px 0 0; color: var(--muted); }
  main { max-width: 960px; margin: 32px auto; padding: 0 24px; }
  .project {
    display: block; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 20px 24px; margin-bottom: 16px;
    transition: border-color .15s;
  }
  .project:hover { border-color: var(--accent); }
  .project h2 { margin: 0 0 6px; font-size: 17px; color: var(--accent); }
  .project p { margin: 0; color: var(--muted); line-height: 1.5; }
  .tag {
    display: inline-block; font-size: 11px; padding: 1px 8px;
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); margin-left: 8px; vertical-align: middle;
  }
  footer { color: var(--muted); font-size: 12px; padding: 24px 40px; }
</style>
</head>
<body>
<header>
  <h1>Tài liệu sản phẩm</h1>
  <p>Hướng dẫn sử dụng phần mềm — chọn dự án bên dưới.</p>
</header>
<main>
  <!-- Thêm dự án mới: chép block .project, sửa href + tiêu đề -->
  <a class="project" href="vsi-measual/">
    <h2>VSI-measual<span class="tag">Machine Vision</span></h2>
    <p>Hướng dẫn tạo recipe cơ bản — hệ thống kiểm tra thị giác công nghiệp
    (anchor, ROI, dung sai, verdict, camera/PLC).</p>
  </a>
</main>
<footer>VSTECH documentation hub</footer>
</body>
</html>
